  <p style="margin:10px 0 0;font-size:14px">👉 想知道士倫怎麼推薦版本、優缺點 → <a href="../../?car=${esc(D.id)}">看 ${esc(D.車款)} 介紹</a></p></div>`}
function sysList(){const sys={"SBS 智慧防撞":"屬於 SBS 智慧防撞","ELK 緊急車道偏移防止":"屬於 ELK 緊急車道偏移防止"};
  return `<section class="sys"><h2>安全系統一覽</h2><p style="font-size:13px;color:#6b6f75;margin:0 0 8px">型錄和廣告上常看到的系統名稱，對應到哪些配備：</p><ul><li><b>i-ACTIVSENSE 主動安全科技</b>：Mazda 所有駕駛輔助的總稱<ul>`+Object.entries(sys).map(([n,t])=>`<li>${n}：${D.items.filter(i=>i.標籤===t).map(i=>esc(i.標題)).join("、")||"—"}</li>`).join("")+`</ul></li></ul></section>`}
function render(scrollTop){
  const vis=D.items.filter(i=>sel<0||i.版本.includes(sel));
  const sc=D.情境.filter(s=>vis.some(i=>i.情境===s));
  if(tab>sc.length)tab=sc.length;
  const tabs=["總覽",...sc];
  document.getElementById("trims").innerHTML=[-1,...D.版本.keys()].map(i=>`<button class="chip${i===sel?" on":""}" onclick="sel=${i};render()">${i<0?"全部版本":esc(D.版本[i])+`<small>${esc(D.售價[i])}</small>`}</button>`).join("");
  document.getElementById("nav").innerHTML=tabs.map((s,k)=>`<button class="chip${k===tab?" here":""}" data-k="${k}" onclick="goTab(${k})">${esc(s)}</button>`).join("");
  const M=document.getElementById("main");
  if(tab===0){M.innerHTML=overview()+`<p class="hint">點上面的版本看價格和差異，點分類看每個配備；也可以左右滑動換頁。</p>`+sysList()}
  else{const s=sc[tab-1],its=vis.filter(i=>i.情境===s),cards=its.filter(i=>i.層級==="卡片"),lines=its.filter(i=>i.層級!=="卡片");
    M.innerHTML=`<section class="scene"><div class="sn">${tab}／${sc.length}</div><h2>${esc(s)}</h2><p class="hook">${esc(D.開場[s]||"")} 這段有 ${its.length} 項配備。</p>
    ${sel>=0?`<p class="hint" style="margin-top:0">目前只顯示 <b>${esc(D.版本[sel])}</b> 有的配備</p>`:""}
    ${cards.length?`<div class="sec">重點配備</div>`+cards.map(i=>`<div class="card"><div class="t">${esc(i.標題)}</div>${body(i)}</div>`).join(""):""}
    ${lines.length?`<div class="sec">${cards.length?"其他配備（點一下看說明）":"點一下看說明"}</div>`+lines.map(i=>`<details class="line"><summary>${esc(i.標題)}</summary>${body(i)}</details>`).join(""):""}</section>`}
  const P=document.getElementById("pager");
  const prev=tab>0?`<button class="prev" onclick="goTab(${tab-1})">← ${esc(tabs[tab-1])}</button>`:"";
  const next=tab<sc.length?`<button class="next" onclick="goTab(${tab+1})">${tab===0?"開始看配備：":"下一段："}${esc(tabs[tab+1])} →</button>`:`<button class="end" onclick="location.href=document.getElementById('line').href">看完了，加 LINE 預約賞車試乘</button>`;
  P.innerHTML=prev+next;
  const cur=document.querySelector("#nav .chip.here");if(cur){const n=document.getElementById("nav");n.scrollTo({left:cur.offsetLeft-n.clientWidth/2+cur.offsetWidth/2,behavior:"smooth"})}
  if(scrollTop){const y=document.getElementById("anchor").getBoundingClientRect().top+scrollY;if(scrollY>y)scrollTo({top:y,behavior:"instant"})}
}
function goTab(k){tab=k;render(true)}
// 左右滑動換頁（附加功能）：水平距離夠長、而且明顯比垂直距離大才算
let tx=0,ty=0;
document.getElementById("main").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.getElementById("main").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){const n=document.querySelectorAll("#nav .chip").length;if(dx<0&&tab<n-1)goTab(tab+1);if(dx>0&&tab>0)goTab(tab-1)}},{passive:true});
document.getElementById("line").href="https://line.me/R/oaMessage/"+encodeURIComponent(D.LINE)+"/?"+encodeURIComponent("你好，我看了士倫車 Mazda 選車指南的 "+D.車款+" 完整配備說明書，想約時間看車。");
render();
</script></body></html>
