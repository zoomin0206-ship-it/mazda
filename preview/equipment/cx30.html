function ver(it){
  if(sel>=0){const n=it.細節.map(d=>d.附註[sel]).filter(Boolean);return `<div class="ver">✓ ${esc(D.版本[sel])} 有${n.length?"（"+esc(n.join("、"))+"）":""}</div>`}
  const diff=it.細節.filter(d=>(it.細節.length>1&&d.版本.length!==it.版本.length)||Object.keys(d.附註).length);
  return `<div class="ver">${esc(vname(it.版本))}${diff.length?`<details class="more"><summary>各版本差異</summary><ul>${diff.map(d=>`<li>${esc(d.名稱)}：${esc(vname(d.版本))}${Object.keys(d.附註).length?"（"+Object.entries(d.附註).map(([i,n])=>D.版本[i]+" "+n).join("；")+"）":""}${d.選配?"（選配）":""}</li>`).join("")}</ul></details>`:""}</div>`}
function act(it){return it.作動.length?`<details class="more"><summary>作動條件</summary><ul>${it.作動.map(a=>`<li>${esc(a.功能)}：${esc(a.條件)}</li>`).join("")}</ul></details>`:""}
// 說明文字排版：第一句當重點，其他句子變成條列；①②③ 拆成小清單；版本名稱、數字加強顯示（內容不刪減）
function hl(t){return esc(t).replace(/(Premium Plus|Premium|Exclusive|Elite|全車型)( 起)?/g,'<span class="v">$1$2</span>').replace(/(\d+(?:\.\d+)?(?:～\d+)?\s*(?:吋|顆|段|公里|km\/h|喇叭|分鐘|L))/g,'<b>$1</b>')}
function fmt(txt){
  const ss=txt.split(/(?<=[。；])/).map(x=>x.trim().replace(/；$/,'。')).filter(Boolean);
  const lead=ss.shift()||"";
  const li=ss.map(x=>{
    const parts=x.split(/(?=[①②③④⑤⑥])/);
    if(parts.length>1){const head=parts.shift();return `<li>${hl(head.replace(/[：:]$/,""))}<ol class="sub">${parts.map(p=>`<li>${hl(p.replace(/^[①②③④⑤⑥]/,"").replace(/[；;。]$/,""))}</li>`).join("")}</ol></li>`}
    return `<li>${hl(x.replace(/。$/,""))}</li>`});
  const lp=lead.split(/(?=[①②③④⑤⑥])/);
  const h0=lp.shift();let L=`<p class="lead2${h0.length>42?" long":""}">${hl(h0.replace(/[：:]$/,"").replace(/。$/,""))}</p>`;
  if(lp.length)L+=`<ol class="sub">${lp.map(p=>`<li>${hl(p.replace(/^[①②③④⑤⑥]/,"").replace(/[；;。]$/,""))}</li>`).join("")}</ol>`;
  return L+(li.length?`<ul class="pts">${li.join("")}</ul>`:"")}
function body(it){return `${it.標籤?`<span class="tag">${esc(it.標籤)}</span>`:""}<div class="d">${fmt(it.說明)}</div>${ver(it)}${act(it)}`}
function verSum(i){const m=D.摘要[i],r=D.推薦.includes(i);return `<div class="sum"><h3>${esc(D.版本[i])}｜${esc(D.售價[i])}${r?`<span class="rec">士倫推薦</span>`:""}</h3><p>${esc(m.開頭)}</p>${m.清單.length?`<ul>${m.清單.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${r&&D.推薦理由?`<p class="why"><b>為什麼推薦：</b>${esc(D.推薦理由)}</p>`:""}</div>`}
function overview(){
  if(sel>=0)return verSum(sel);
  const o=D.總覽;
  return `<div class="ov"><h2>${esc(D.車款)}</h2><div class="meta">${esc([o.分類,o.產地,o.價格].filter(Boolean).join("｜"))}</div>
  ${o.一句話?`<div class="quote">${esc(o.一句話)}<div class="by">士倫觀點</div></div>`:""}
  <ul><li>${esc(o.動力)}、${esc(o.驅動)}</li>${o.適合.length?`<li>適合：${o.適合.map(x=>esc(x.split("：")[0])).join("、")}</li>`:""}${o.評等.length?`<li>海外安全評等：${esc(o.評等.join("、"))}</li>`:""}</ul>
  <p style="margin:10px 0 0;font-size:14px">👉 想知道士倫怎麼推薦版本、優缺點 → <a href="../../?car=${esc(D.id)}">看 ${esc(D.車款)} 介紹</a></p></div>
  <div class="sec" style="margin-top:16px">各版本差在哪</div>`+D.版本.map((_,i)=>verSum(i)).join("")}
function sysList(){const sys={"SBS 智慧防撞":"屬於 SBS 智慧防撞","ELK 緊急車道偏移防止":"屬於 ELK 緊急車道偏移防止"};
  return `<section class="sys"><h2>安全系統一覽</h2><p style="font-size:13px;color:#6b6f75;margin:0 0 8px">型錄和廣告上常看到的系統名稱，對應到哪些配備：</p><ul><li><b>i-ACTIVSENSE 主動安全科技</b>：Mazda 所有駕駛輔助的總稱<ul>`+Object.entries(sys).map(([n,t])=>`<li>${n}：${D.items.filter(i=>i.標籤===t).map(i=>esc(i.標題)).join("、")||"—"}</li>`).join("")+`</ul></li></ul></section>`}
function render(){
  const vis=D.items.filter(i=>sel<0||i.版本.includes(sel));
  const sc=D.情境.filter(s=>vis.some(i=>i.情境===s));
  const tabs=["總覽",...sc];
  document.getElementById("trims").innerHTML=[-1,...D.版本.keys()].map(i=>`<button class="chip${i===sel?" on":""}" onclick="sel=${i};render()">${i<0?"全部版本":esc(D.版本[i])+`<small>${esc(D.售價[i])}</small>`}</button>`).join("");
  document.getElementById("nav").innerHTML=tabs.map((s,k)=>`<button class="chip" data-k="${k}" onclick="go(${k})">${esc(s)}</button>`).join("");
  document.getElementById("main").innerHTML=`<section class="scene" id="s0"><div class="band"><span>總覽</span></div>${overview()}<p class="hint">點上面的版本看價格和差異；點分類跳到那一段，往下滑就能一路看完。</p></section>`+
   sc.map((s,k)=>{const its=vis.filter(i=>i.情境===s),cards=its.filter(i=>i.層級==="卡片"),lines=its.filter(i=>i.層級!=="卡片");
    return `<section class="scene" id="s${k+1}"><div class="band"><em>${k+1}／${sc.length}</em><span>${esc(s)}</span><i>${its.length} 項</i></div><p class="hook">${esc(D.開場[s]||"")}</p>
    ${sel>=0?`<p class="hint" style="margin-top:0">只顯示 <b>${esc(D.版本[sel])}</b> 有的配備</p>`:""}
    ${cards.length?`<div class="sec">重點配備</div>`+cards.map(i=>`<div class="card"><div class="t">${esc(i.標題)}</div>${body(i)}</div>`).join(""):""}
    ${lines.length?`<div class="sec">${cards.length?"其他配備（點一下看說明）":"點一下看說明"}</div>`+lines.map(i=>`<details class="line"><summary>${esc(i.標題)}</summary>${body(i)}</details>`).join(""):""}
    <div class="endline">✓ ${esc(s)}看完了${k<sc.length-1?`　·　下一段：${esc(sc[k+1])} ↓`:""}</div></section>`}).join("")+sysList();
  cur=-2;spy();
}
// 點分類：跳到那一段；往下滑時自動標出目前在哪一段
let lock=0,cur=-2;
function mark(k){document.querySelectorAll("#nav .chip").forEach(b=>{const on=+b.dataset.k===k;b.classList.toggle("here",on);if(on){const n=document.getElementById("nav");n.scrollTo({left:b.offsetLeft-n.clientWidth/2+b.offsetWidth/2,behavior:"smooth"})}})}
function go(k){lock=Date.now();cur=k;mark(k);const el=document.getElementById("s"+k),bar=document.querySelector(".bar").offsetHeight;
  scrollTo({top:el.getBoundingClientRect().top+scrollY-bar-6,behavior:"smooth"})}
function spy(){if(Date.now()-lock<900)return;const top=document.querySelector(".bar").getBoundingClientRect().bottom+12;let k=0;
  document.querySelectorAll(".scene").forEach((el,i)=>{if(el.getBoundingClientRect().top<=top)k=i});if(k!==cur){cur=k;mark(k)}}
addEventListener("scroll",()=>requestAnimationFrame(spy),{passive:true});
document.getElementById("line").href="https://line.me/R/oaMessage/"+encodeURIComponent(D.LINE)+"/?"+encodeURIComponent("你好，我看了士倫車 Mazda 選車指南的 "+D.車款+" 完整配備說明書，想約時間看車。");
render();
</script></body></html>
